[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uknowledge"
version = "0.1.0"
description = "uKnowledge external route ownership package"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9",
]

[tool.setuptools]
packages = ["uknowledge"]
